<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Missing Angle</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1c1c1a;--muted:#6b6a64;--accent:#2f6fed;--good:#1f9d55;--bad:#d64545;--line:#d9d7cf;--fill:#e8efff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161618;--card:#212124;--text:#f0efea;--muted:#a09f98;--accent:#6c9bff;--good:#4cc27f;--bad:#ff7070;--line:#3a3a3e;--fill:#26324f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161618;--card:#212124;--text:#f0efea;--muted:#a09f98;--accent:#6c9bff;--good:#4cc27f;--bad:#ff7070;--line:#3a3a3e;--fill:#26324f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:560px}
h1{font-size:1.4rem;margin:8px 0 4px}
p.sub{color:var(--muted);margin:0 0 12px;font-size:.92rem;line-height:1.4}
.stats{display:flex;gap:16px;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.stats b{color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;position:relative}
svg{width:100%;height:auto;display:block}
.overlay{position:absolute;inset:12px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:var(--muted);text-align:center;pointer-events:none}
.bar{height:6px;background:var(--line);border-radius:3px;margin:10px 0;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.row{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;font-size:1.2rem;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{font-size:1rem;padding:12px 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#msg{min-height:1.6em;margin-top:10px;font-weight:600}
.good{color:var(--good)}.bad{color:var(--bad)}
.lbl{font-size:15px;font-weight:600;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
</style>
</head>
<body>
<main>
<h1>Find the missing angle</h1>
<p class="sub">A 10-sided shape appears for 2 seconds. Nine interior angles are shown; one is “?”. Remember them, then type the missing angle within 5 seconds. (Interior angles of a decagon add up to 1440°.)</p>
<div class="stats"><span>Score: <b id="score">0</b></span><span>Streak: <b id="streak">0</b></span><span>Round: <b id="round">0</b></span></div>
<div class="card">
<svg id="svg" viewBox="0 0 500 500" role="img" aria-label="Decagon"></svg>
<div class="overlay" id="overlay">Press Start</div>
</div>
<div class="bar"><i id="bar"></i></div>
<div class="row">
<input id="ans" type="number" inputmode="numeric" placeholder="Missing angle (°)" disabled>
<button id="go">Start</button>
</div>
<div id="msg"></div>
</main>
<script>
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("svg"),overlay=document.getElementById("overlay"),
ans=document.getElementById("ans"),go=document.getElementById("go"),msg=document.getElementById("msg"),bar=document.getElementById("bar");
let state="idle",poly=null,answer=0,score=0,streak=0,round=0,timer=null,guessTimer=null;

function gen(){
  const N=10,cx=250,cy=250,off=Math.random()*Math.PI*2;
  const pts=[];
  for(let i=0;i<N;i++){
    const a=off+(i+(Math.random()*.7-.35))*2*Math.PI/N;
    const r=75+Math.random()*115;
    pts.push({x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)}); // y flipped => CCW on screen math coords
  }
  // work in math coords (y up) to compute interior angles
  const m=pts.map(p=>({x:p.x,y:cy*2-p.y}));
  const ang=[],bis=[];
  for(let i=0;i<N;i++){
    const p=m[(i+N-1)%N],v=m[i],n=m[(i+1)%N];
    const a=Math.atan2(n.y-v.y,n.x-v.x),b=Math.atan2(p.y-v.y,p.x-v.x);
    let d=(b-a)%(2*Math.PI);if(d<0)d+=2*Math.PI;
    ang.push(d*180/Math.PI);
    const bi=a+d/2;bis.push({x:Math.cos(bi),y:-Math.sin(bi)}); // screen-space inward bisector
  }
  const rounded=ang.map(Math.round);
  const hide=Math.floor(Math.random()*N);
  let sum=0;rounded.forEach((v,i)=>{if(i!==hide)sum+=v});
  const miss=1440-sum;
  rounded[hide]=miss;
  return{pts,bis,vals:rounded,hide};
}

function draw(p,reveal){
  svg.innerHTML="";
  const poly=document.createElementNS(NS,"polygon");
  poly.setAttribute("points",p.pts.map(q=>q.x.toFixed(1)+","+q.y.toFixed(1)).join(" "));
  poly.setAttribute("fill","var(--fill)");poly.setAttribute("stroke","var(--accent)");
  poly.setAttribute("stroke-width","3");poly.setAttribute("stroke-linejoin","round");
  svg.appendChild(poly);
  p.pts.forEach((q,i)=>{
    const dot=document.createElementNS(NS,"circle");
    dot.setAttribute("cx",q.x);dot.setAttribute("cy",q.y);dot.setAttribute("r",4);
    dot.setAttribute("fill",i===p.hide?"var(--bad)":"var(--accent)");svg.appendChild(dot);
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class","lbl");
    t.setAttribute("x",q.x-p.bis[i].x*24);t.setAttribute("y",q.y-p.bis[i].y*24);
    if(i===p.hide){t.textContent=reveal?p.vals[i]+"°":"?";t.setAttribute("style","fill:var(--bad);font-size:20px");}
    else t.textContent=p.vals[i]+"°";
    svg.appendChild(t);
  });
}

function setBar(sec){
  bar.style.transition="none";bar.style.transform="scaleX(1)";
  void bar.offsetWidth;
  bar.style.transition="transform "+sec+"s linear";bar.style.transform="scaleX(0)";
}

function newRound(){
  clearTimeout(timer);clearTimeout(guessTimer);
  round++;document.getElementById("round").textContent=round;
  poly=gen();answer=poly.vals[poly.hide];
  draw(poly,false);overlay.textContent="";
  msg.textContent="";msg.className="";ans.value="";ans.disabled=true;go.disabled=true;
  state="show";setBar(2);
  timer=setTimeout(()=>{
    svg.innerHTML="";overlay.textContent="Shape hidden — you have 5 seconds!";
    state="guess";ans.disabled=false;go.disabled=false;go.textContent="Submit";ans.focus();
    setBar(5);
    guessTimer=setTimeout(()=>submit(true),5000);
  },2000);
}

function submit(timedOut){
  if(state!=="guess")return;
  const v=ans.value.trim();if(!timedOut&&v==="")return;
  clearTimeout(guessTimer);
  bar.style.transition="none";bar.style.transform="scaleX(1)";
  const n=Number(v);
  const ok=!timedOut&&n===answer;
  if(ok){score++;streak++;msg.textContent="Correct! "+answer+"°";msg.className="good";}
  else{streak=0;msg.textContent=(timedOut?"Time’s up! The answer was ":"Not quite — the answer was ")+answer+"°";msg.className="bad";}
  document.getElementById("score").textContent=score;
  document.getElementById("streak").textContent=streak;
  overlay.textContent="";draw(poly,true);
  state="done";ans.disabled=true;go.textContent="Next shape";
}

go.onclick=()=>{
  if(state==="guess")submit(false);
  else if(state==="idle"||state==="done")newRound();
};
ans.addEventListener("keydown",e=>{if(e.key==="Enter"&&state==="guess")submit(false)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(state==="idle"||state==="done"))newRound()});
</script>
</body>
</html>
